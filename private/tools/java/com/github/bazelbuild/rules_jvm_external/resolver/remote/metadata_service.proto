syntax = "proto3";

package com.github.bazelbuild.rules_jvm_external.resolver.remote;

option java_multiple_files = true;
option java_package = "com.github.bazelbuild.rules_jvm_external.resolver.remote.grpc";
option java_outer_classname = "MetadataServiceProto";

// Service defining the Maven dependency metadata lookup and resolution operations.
service GrpcMetadataService {
  // Retrieves metadata (and triggers resolution/download on the server side on cache miss)
  rpc GetMetadata (GetMetadataRequest) returns (GetMetadataResponse);
}

// Request to retrieve dependency metadata.
message GetMetadataRequest {
  // The Maven coordinates (groupId:artifactId:version[:classifier][:extension])
  string coordinates = 1;

  // The collection of repositories to try resolving the artifact from
  repeated string repositories = 2;
}

// Response containing the dependency metadata.
message GetMetadataResponse {
  // True if the metadata was successfully found or resolved, false if not found.
  bool found = 1;

  // The SHA-256 hash of the artifact
  string sha256 = 2;

  // The subset of repository URIs from which the artifact is available
  repeated string repositories = 3;

  // The set of package names contained in the artifact jar
  repeated string packages = 4;

  // The set of fully qualified class names contained in the artifact jar
  repeated string classes = 5;

  // Mapping of service interface names to their implementing class names (SPI)
  map<string, ServiceImplementations> services = 6;
}

message ServiceImplementations {
  repeated string implementation_classes = 1;
}
